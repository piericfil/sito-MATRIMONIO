<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97642;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F4A460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" stroke="#FAF7F2" stroke-width="2"/>

  <!-- Initials C&L -->
  <text x="50" y="62" font-family="'Cormorant Garamond', serif" font-size="42" font-weight="600" fill="#FAF7F2" text-anchor="middle">C&L</text>
</svg>
